name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type-Check, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome (lint + format check)
        run: npx biome ci .

      - name: Astro type check
        run: npm run check

      - name: Build
        # Catches anything biome/astro-check misses — broken imports,
        # endpoint runtime errors, asset pipeline failures.
        run: npm run build
